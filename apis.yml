aid: d3
name: D3
description: >-
  D3 is a crypto-infrastructure company building the internet's domain layer,
  tokenized. Through its Doma Protocol, D3 brings ICANN domain names on-chain as
  tokenized name assets and unlocks "DomainFi" — programmable DNS, fractionalized
  domain tokens, an on-chain marketplace, and agentic commerce. Developers use the
  Doma API (a GraphQL subgraph plus REST Poll and Orderbook APIs), the doma CLI,
  and portable Agent Skills to register, tokenize, trade, and manage domains across
  the Doma mainnet (chain 97477) and testnet (97476). D3 is backed by Paradigm.
